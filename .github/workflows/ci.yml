name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run ruff check src tests benchmarks

      - name: Run formatter check
        run: uv run ruff format --check src tests benchmarks

      - name: Run typechecker
        run: uv run mypy --strict src/nanoserve/core src/nanoserve/sampling src/nanoserve/config.py

      - name: Run test suite
        run: uv run pytest -v -m "not gpu"
